# Main CI pipeline.
#
# Current scope: static checks, builds, server integration tests, E2E, secret
# scanning, a run summary, and deployment of the backend to Fly.io staging.
#
# Both test layers run against real dependencies rather than mocks: E2E against
# a stub backend on BACKEND_URL, server tests against MinIO in a service
# container. A mock would only ever confirm the assumptions we wrote into it —
# signing, path-style addressing and error shapes are exactly what mocks
# imitate instead of reproducing.
#
# Layout: eight parallel jobs, then a gate, then deploy. Nothing among the
# eight needs anything else there, so their wall clock is the slowest single
# job, not the sum.
#
#   client-static ─┐
#   server-static ─┤
#   server-test   ─┤   (MinIO у docker compose)
#   client-build  ─┤
#   server-build  ─┼─► summary ──► deploy (лише push у momot-main)
#   e2e           ─┤                Fly.io staging, образ із GHCR за git-хешем
#   image         ─┤   (збірка на PR, пуш у GHCR лише з momot-main)
#   security      ─┘
#
# TODO(verify): action major versions below were not checked against the
# marketplace from this environment. Confirm actions/checkout, actions/setup-node
# and gitleaks-action are on the versions pinned here, then consider pinning all
# three by commit SHA.

name: CI

# Integration branch is `momot-main`, not `main`. The filter below matches the
# PR *base* branch, so a PR targeting anything else runs nothing at all — this
# list is what decides whether the pipeline exists for a given change.
#
# `momot-main` is also the repository's default branch, which matters beyond
# looks: `schedule:` and `workflow_dispatch` workflows only ever run from the
# default branch. The nightly full E2E matrix therefore belongs on this branch
# and nowhere else.
on:
  pull_request:
    branches: [momot-main]
  push:
    branches: [momot-main]

# A second push to the same branch cancels the run still in flight. Without
# this you pay for two full pipelines and the stale result finishes last.
#
# Pull requests only. A run on momot-main does not end at a green check, it
# ends at a deploy — and a deploy killed halfway through a rolling release
# leaves the environment in a state nobody described: some machines on the new
# image, some on the old, and no record of which. Paying for one redundant
# pipeline is cheaper than an environment whose contents are a guess.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Static analysis ────────────────────────────────────────────────────────

  client-static:
    name: Client · typecheck & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4
        with:
          # Типово checkout лишає GITHUB_TOKEN у .git/config. Жоден
          # крок нижче не робить автентифікованих git-операцій, отже
          # токен тут — лише зайва поверхня для коду, що виконується
          # після checkout (npm-скрипти, залежності, браузери).
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      # ci, not install: install silently rewrites package-lock.json when it
      # disagrees with package.json, which is how CI ends up validating a
      # dependency tree that exists on no developer's machine.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Fails only when the error count exceeds .ci/lint-baseline.json. Every
      # existing violation is still printed in full on every run, so the debt
      # stays visible rather than becoming invisible.
      #
      # NOTE: the companion gate `npm run lint:changed` (files touched by a PR
      # must be clean) is intentionally not wired up yet. MP-004 introduces the
      # entire client/ directory, so on that branch "changed files" means all
      # 104 of them and the gate is equivalent to demanding zero debt. It gets
      # added in the first PR after MP-004 lands on momot-main, where it becomes both
      # meaningful and cheap. The script is in the repo and runnable today.
      - name: Lint (baseline gate)
        run: npm run lint:baseline

  server-static:
    name: Server · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4
        with:
          # Типово checkout лишає GITHUB_TOKEN у .git/config. Жоден
          # крок нижче не робить автентифікованих git-операцій, отже
          # токен тут — лише зайва поверхня для коду, що виконується
          # після checkout (npm-скрипти, залежності, браузери).
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # No lint step: the server has no ESLint installed and no config. A script
      # that runs no real check would make this job look stronger than it is.
      # Tracked as an infrastructure gap in phase3.md section 6.2.

  # ── Builds ─────────────────────────────────────────────────────────────────

  client-build:
    name: Client · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4
        with:
          # Типово checkout лишає GITHUB_TOKEN у .git/config. Жоден
          # крок нижче не робить автентифікованих git-операцій, отже
          # токен тут — лише зайва поверхня для коду, що виконується
          # після checkout (npm-скрипти, залежності, браузери).
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      # Turbopack keeps its incremental cache in .next/cache. Restoring it
      # across runs is the difference between a cold and a warm build. The key
      # includes the lockfile and every source file, so a source change gets a
      # fresh entry while restore-keys still fall back to the nearest older one.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: client/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('client/package-lock.json') }}-${{ hashFiles('client/src/**/*.{ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('client/package-lock.json') }}-

      - name: Build
        run: npm run build

      # No artifact upload. This comment used to say there was no E2E job to
      # consume one; there is, and it builds the client itself. So the two jobs
      # do genuinely build twice, and the E2E suite exercises a binary this job
      # never saw. That is worth fixing with build-once/deploy-many — but the
      # place to do it is alongside the client deploy, where a third consumer
      # appears and one shared artifact starts paying for the upload.

  server-build:
    name: Server · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4
        with:
          # Типово checkout лишає GITHUB_TOKEN у .git/config. Жоден
          # крок нижче не робить автентифікованих git-операцій, отже
          # токен тут — лише зайва поверхня для коду, що виконується
          # після checkout (npm-скрипти, залежності, браузери).
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

  # ── Інтеграційні тести сервера ─────────────────────────────────────────────

  server-test:
    name: Server · storage tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # MinIO піднімається через той самий docker-compose.yml, яким користується
    # локальна розробка. Тести ходять у нього тим самим кодом, яким прод ходить
    # у R2 — перевіряється справжній шлях, а не мок, який підтверджував би лише
    # наші ж припущення.
    #
    # Чому не `services:` — дві причини, і друга неочевидна:
    #
    # 1. Service-контейнери GitHub не дозволяють задати команду запуску, а
    #    офіційний образ minio/minio без `server /data` просто друкує довідку
    #    й виходить. Саме тому спершу тут стояв bitnami/minio, у якого
    #    робочий CMD за замовчуванням — а Bitnami прибрали безкоштовні образи
    #    з Docker Hub, і джоба впала ще на «Initialize containers».
    # 2. Навіть якби образ був, `services:` — це друге, окреме описання того
    #    самого середовища. Два описання розходяться. Compose-файл робить
    #    локальний стек і CI однією конфігурацією, і зламатись вони можуть
    #    тільки разом.

    env:
      STORAGE_BUCKET: mockup-uploads
      STORAGE_REGION: auto
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      STORAGE_FORCE_PATH_STYLE: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Піднімаємо сховище до npm ci, а не після: --wait блокує лише до
      # healthy (локально ~6 с), і поки воно стартує, встановлення залежностей
      # уже йде. Порядок кроків тут — це безкоштовні секунди.
      - name: Start MinIO
        working-directory: ${{ github.workspace }}
        run: docker compose up -d --wait minio

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # Окремим кроком після --wait, а не через depends_on: бакет має існувати
      # до першого тесту, інакше перший же put падає на NoSuchBucket.
      - name: Create bucket
        working-directory: ${{ github.workspace }}
        run: docker compose run --rm minio-init

      - name: Run tests
        run: npm test

      # Логи сховища потрібні рівно тоді, коли тести впали: майже кожна їхня
      # помилка — це насправді відповідь MinIO, якої не видно з боку клієнта.
      - name: MinIO logs
        if: failure()
        working-directory: ${{ github.workspace }}
        run: docker compose logs minio

  # ── End-to-end ─────────────────────────────────────────────────────────────

  e2e:
    name: E2E · Playwright (chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    env:
      # Куди Next проксює /auth/* і /dashboard/* — тут це стаб, а не справжній
      # бекенд. Виставлено і на білд, і на старт свідомо: destination у
      # rewrites фіксується на одному з цих етапів, і залежати від того, на
      # якому саме, не варто.
      BACKEND_URL: http://localhost:4010
      # Порожнє = same-origin. Браузер б'є в Next, Next проксює далі.
      NEXT_PUBLIC_API_URL: ''

    steps:
      - uses: actions/checkout@v4
        with:
          # Типово checkout лишає GITHUB_TOKEN у .git/config. Жоден
          # крок нижче не робить автентифікованих git-операцій, отже
          # токен тут — лише зайва поверхня для коду, що виконується
          # після checkout (npm-скрипти, залежності, браузери).
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      # Браузери важать сотні мегабайт і не змінюються між ранами — тягнути їх
      # щоразу означає платити хвилинами за те, що вже було. Ключ прив'язаний
      # до lockfile: оновлення @playwright/test дає новий кеш, як і має бути.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('client/package-lock.json') }}

      # Тільки chromium: PR-смуга має лишатись швидкою. Повна матриця
      # (firefox + webkit) — робота для нічного прогону, і проєкти під неї в
      # playwright.config.ts уже описані.
      #
      # Крок пропускається при попаданні в кеш — інакше кеш вище не економив
      # нічого: він відновлював браузери, а наступний крок усе одно йшов у
      # мережу по них. Саме заради цієї умови в кроку кешу стоїть `id`.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Системні бібліотеки браузера лежать поза ~/.cache/ms-playwright, тож
      # кеш їх не відновлює. При попаданні ставимо тільки їх — без повторного
      # завантаження самого chromium.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Прод-збірка, а не dev-сервер. Тест, зелений у dev, ще нічого не каже
      # про прод: інші таймінги, інша обробка помилок, інший рантайм React.
      # playwright.config.ts бачить CI=true і піднімає `next start`.
      - name: Build
        run: npm run build

      - name: Run E2E
        run: npm run e2e:smoke

      # Звіт потрібен рівно тоді, коли щось впало. Заливати його на кожному
      # зеленому рані — це час і місце за артефакт, який ніхто не відкриє.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

  # ── Образ бекенда ──────────────────────────────────────────────────────────

  image:
    name: Server · docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Потрібне лише цій джобі й лише щоб покласти образ у ghcr.io.
      # Права видаються точково: решта джоб їх не має і не повинна мати.
      packages: write

    # Посилання на образ, який ця джоба реально запушила. Деплой бере його
    # звідси, а не складає з github.repository — див. коментар біля кроку.
    outputs:
      image: ${{ steps.ref.outputs.image }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      # На PR образ ТІЛЬКИ збирається. Пушать лише те, що вже лежить у
      # momot-main: гілка з PR ще може не змержитись, а реєстр, засмічений
      # образами закритих PR, ніхто ніколи не чистить.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Теги: git-хеш і latest. Хеш — головний, бо він відповідає на питання
      # «який саме код зараз крутиться» і дозволяє відкотитись на конкретний
      # коміт. latest сам по собі непридатний для деплою: він означає різне в
      # різний час, і два сервери з latest можуть крутити різні збірки.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/momot-main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: server
          push: ${{ github.event_name == 'push' }}
          # На PR образ не пушиться, але має лишитись у локальному демоні —
          # інакше смоук-тесту нема що запускати.
          load: ${{ github.event_name == 'pull_request' }}
          # Тільки теги з metadata-action. Локальний тег тут був помилкою:
          # на push `push: true` штовхає КОЖЕН тег у реєстр, і `mockup-server:ci`
          # їхав у docker.io/library, де в нас прав немає. Смоук-тест нижче
          # бере образ за тим самим ім'ям, під яким його завантажив `load`.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Кеш шарів між ранами. Без нього кожен PR ставить залежності з нуля,
          # хоча package-lock.json не мінявся тижнями.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SBOM — перелік усього, що всередині образу. Provenance — підписане
          # свідчення про те, ким і з якого коміту він зібраний.
          #
          # Навіщо: коли завтра оголосять вразливість у якомусь пакеті,
          # питання буде «у яких наших образах він є». Без SBOM відповідь
          # шукають, розпаковуючи кожен образ руками. Provenance відповідає на
          # інше питання — «чи це справді зібрав наш CI, а не хтось інший».
          # Тільки для образів, які реально публікуються. Атестації роблять
          # із образу список маніфестів, а `load: true` вміє завантажити в
          # локальний демон лише один — тобто на PR ця пара несумісна.
          # Для невиданого образу атестації й не потрібні: питання «звідки цей
          # образ» виникає до опублікованого, а не до тимчасового.
          sbom: ${{ github.event_name == 'push' }}
          provenance: ${{ github.event_name == 'push' && 'mode=max' || 'false' }}

      # Єдине місце, де народжується посилання на образ. Усе нижче — скан,
      # смоук, деплой — бере адресу звідси й ніде не складає її повторно.
      #
      # Дві події дають дві різні адреси, і це не примха:
      #   pull_request — образ існує лише в локальному демоні (`load: true`),
      #                  його адреса — imageid;
      #   push         — образ уже в реєстрі, адреса — дайджест. Саме її
      #                  отримає деплой, тому саме її мають перевіряти скан і
      #                  смоук. Перевіряти на push щось інше означає віддавати
      #                  в staging артефакт, якого не бачила жодна перевірка.
      #
      # Дайджест, а не тег: тег можна перепризначити, дайджест — ні. Їде рівно
      # те, що зібралось у цьому рані.
      #
      # Регістр знижується примусово. Деплой раніше складав адресу сам із
      # github.repository — а це `All1in/…`, з великої літери. Імена в OCI
      # мусять бути в нижньому регістрі, тож flyctl відкидав таке посилання за
      # три секунди, ще до мережі, і жоден деплой з CI не проходив.
      - name: Resolve image reference
        id: ref
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'push' ]; then
            digest='${{ steps.build.outputs.digest }}'
            # Порожнє значення тут дало б адресу виду `ghcr.io/…/server@`, і
            # впало б аж у flyctl, повідомленням про формат посилання. Краще
            # впасти тут і сказати, що саме не повернула збірка.
            [ -n "$digest" ] || { echo '::error::Збірка не повернула digest'; exit 1; }
            name=$(echo "ghcr.io/${{ github.repository }}/server" | tr '[:upper:]' '[:lower:]')
            echo "image=${name}@${digest}" >> "$GITHUB_OUTPUT"
          else
            imageid='${{ steps.build.outputs.imageid }}'
            [ -n "$imageid" ] || { echo '::error::Збірка не повернула imageid'; exit 1; }
            echo "image=${imageid}" >> "$GITHUB_OUTPUT"
          fi

      # На push образ лишився в реєстрі, а не в локальному демоні: `load` для
      # push вимкнено, бо він несумісний з атестаціями. Забираємо його назад —
      # інакше сканувати й запускати нижче нема чого.
      - name: Pull published image
        if: github.event_name == 'push'
        run: docker pull '${{ steps.ref.outputs.image }}'

      # Сканування на відомі вразливості. Не блокує PR, доки не побачимо
      # реальний рівень шуму: гейт, який червоніє на кожному рані через CVE в
      # базовому образі без доступного патча, привчає ігнорувати червоне.
      # Спершу вимірюємо, потім вирішуємо поріг.
      - name: Scan image for vulnerabilities
        # Крок інформаційний за задумом (exit-code: 0), тож і власні збої
        # екшена не мають червонити пайплайн. Найчастіша причина — ліміт на
        # завантаження бази вразливостей із ghcr.io, тобто чужа інфраструктура.
        # Сканер, який падає сам по собі, не має права зупиняти доставку.
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Та сама адреса, що поїде в деплой. Сканер, який дивиться на інший
          # артефакт, ніж той, що доставляється, вимірює чуже.
          image-ref: ${{ steps.ref.outputs.image }}
          format: table
          severity: HIGH,CRITICAL
          # Тільки те, що можна виправити оновленням. CVE без патча — це
          # інформація до відома, а не задача.
          ignore-unfixed: true
          exit-code: '0'

      # Образ, який зібрався, але не стартує, — це зелена джоба й зламаний
      # деплой. Тут перевіряється рівно те, що поїде: контейнер піднімається,
      # підключається до бази і відповідає на /health.
      #
      # На обох подіях, не лише на PR. Раніше крок стояв під pull_request, і
      # виходило, що образ, який реально публікується і за годину опиняється в
      # staging, не запускав ніхто — гарантію давав сусідній артефакт.
      #
      # Mongo обов'язкова: start() робить connectDb() ДО app.listen(), тож без
      # бази процес до прослуховування порту просто не доходить. Це не вада —
      # сервіс, який відповідає, не маючи бази, брехав би оркестратору.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          IMAGE='${{ steps.ref.outputs.image }}'
          docker network create smoke-net
          docker run -d --name smoke-mongo --network smoke-net \
            mongo:7@sha256:444d798458e5aa40f3667230a9c631974fa169c32ae4a2d924658ac72b753122

          # Дочікуємось бази до старту застосунку. Він робить connectDb() до
          # app.listen(), тож піднятий раніше за Mongo просто помре, і смоук
          # покаже «контейнер не відповів», хоча образ бездоганний.
          for _ in $(seq 1 30); do
            docker exec smoke-mongo mongosh --quiet --eval 'db.adminCommand("ping")' >/dev/null 2>&1 && break
            sleep 2
          done

          docker run -d --name smoke --network smoke-net \
            -e MONGO_URI=mongodb://smoke-mongo:27017/smoke \
            -e STORAGE_BUCKET=smoke -e STORAGE_ENDPOINT=http://minio.invalid:9000 \
            -e STORAGE_ACCESS_KEY_ID=x -e STORAGE_SECRET_ACCESS_KEY=y \
            "${IMAGE}"

          ok=""
          for _ in $(seq 1 20); do
            if docker exec smoke node -e "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              ok=1; break
            fi
            sleep 3
          done

          docker logs smoke
          if [ -z "$ok" ]; then echo '::error::Контейнер не відповів на /health'; exit 1; fi

          # Зупинка теж є предметом перевірки: код виходу 0 означає, що
          # SIGTERM оброблено, а не що процес убито (тоді було б 143).
          docker stop smoke
          code=$(docker inspect --format='{{.State.ExitCode}}' smoke)
          echo "exit code: $code"
          [ "$code" = "0" ] || { echo '::error::Некоректна зупинка контейнера'; exit 1; }

      - name: Clean up smoke test
        if: always()
        run: docker rm -f smoke smoke-mongo 2>/dev/null; docker network rm smoke-net 2>/dev/null; true

  # ── Security ───────────────────────────────────────────────────────────────

  security:
    name: Security · gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Gitleaks scans history, not just the working tree. A shallow clone
          # would let a secret that was committed and later removed pass
          # unnoticed — and removing a secret from a later commit does not
          # remove it from the repository.
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action is free for public repositories. If this repo is
          # still private when the workflow first runs, this step will ask for
          # a GITLEAKS_LICENSE and fail. Making the repo public is already the
          # plan (it also unlocks unlimited Actions minutes and branch
          # protection on the Free plan).

  # ── Summary ────────────────────────────────────────────────────────────────

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [client-static, server-static, server-test, client-build, server-build, e2e, image, security]
    # Run even when something upstream failed — a summary that only appears on
    # success is useless exactly when it is needed.
    if: always()

    steps:
      - name: Write run summary
        run: |
          {
            echo "## CI result"
            echo ""
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| Client typecheck & lint | ${{ needs.client-static.result }} |"
            echo "| Server typecheck | ${{ needs.server-static.result }} |"
            echo "| Server storage tests | ${{ needs.server-test.result }} |"
            echo "| Client build | ${{ needs.client-build.result }} |"
            echo "| Server build | ${{ needs.server-build.result }} |"
            echo "| E2E (chromium) | ${{ needs.e2e.result }} |"
            echo "| Docker image | ${{ needs.image.result }} |"
            echo "| Gitleaks | ${{ needs.security.result }} |"
            echo ""
            echo "Lint debt is gated against \`.ci/lint-baseline.json\`, not against zero."
            echo "E2E runs chromium only, against the stub backend. Full browser matrix is nightly work."
          } >> "$GITHUB_STEP_SUMMARY"

      # The summary step above always succeeds, so it cannot be the thing that
      # turns the pipeline red. This step is what propagates upstream failure.
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required checks failed. See the table in the run summary."
          exit 1

  # ── Деплой ─────────────────────────────────────────────────────────────────
  #
  # Тут закінчується CI і починається CD. Усе вище лише вимірює; ця джоба
  # єдина щось змінює у зовнішньому світі.

  deploy:
    name: Deploy · staging
    runs-on: ubuntu-latest

    # Тільки після мержу. На PR деплою немає й бути не може: гілка ще може не
    # злитись, а staging один на всіх — два PR затирали б одне одного.
    if: github.event_name == 'push'

    # Через summary, а не напряму через image. Summary червоніє, якщо впала
    # будь-яка з восьми джоб, отже деплой не станеться при зламаних тестах,
    # типах чи лінті — а не лише при зламаному образі.
    #
    # image тут другим — не заради порядку виконання (summary вже його чекає),
    # а щоб дістати outputs: до них є доступ лише через needs.
    needs: [summary, image]

    # URL з'явиться на сторінці ділойментів репозиторію — видно, що і куди
    # поїхало, без походу в чужу панель.
    environment:
      name: staging
      url: https://mockup-staging.fly.dev

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Хеш, а не @master. Ця джоба — єдина, у якої є FLY_API_TOKEN, і код
      # екшена виконується всередині неї. Рухома гілка означає, що завтра тут
      # запуститься не той код, який перевірявся сьогодні, а токен йому вже
      # виданий. Хеш нижче — це тег 1.6 того самого репозиторію.
      #
      # version закріплено з тієї ж причини: за замовчуванням екшен ставить
      # latest, тобто flyctl підмінюється сам собою між ранами, і деплой
      # починає залежати від дня запуску. Апстрім прямо радить пін для
      # прод-деплоїв. Обидва піни оновлює Renovate — тег у коментарі він
      # читає як версію екшена.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.82

      # Образ НЕ збирається заново. Джоба image вже зібрала його з цього ж
      # коміта, перевірила смоук-тестом і поклала в GHCR. Друга збірка могла б
      # дати інший результат — і тоді на сервер поїхало б не те, що проходило
      # перевірки. Це і є build once, deploy many.
      #
      # Посилання приходить з джоби image за дайджестом, не збирається тут
      # руками: ім'я, складене вручну, — це припущення про чужий формат, і
      # саме воно ламало кожен деплой. Дайджест не тег: за ним неможливо
      # отримати не той образ, навіть якщо тег хтось перезапише.
      # Запам'ятовуємо, що крутиться ЗАРАЗ, до того як це змінити. Інакше
      # відкочуватись буде нікуди: після невдалого деплою попередній образ
      # ніде не записаний, а вгадувати його за «попереднім комітом» не можна —
      # попередній коміт і попередній успішний деплой це різні речі рівно тоді,
      # коли відкат і потрібен.
      #
      # Питаємо Fly, а не власну пам'ять: якщо хтось деплоїв руками, правду
      # знає тільки платформа.
      #
      # Дістаємо регулярним виразом із сирого JSON, а не за шляхом у структурі.
      # Шлях — це припущення про чужий формат, і саме такі припущення ламали
      # тут усе, що можна. Нам байдуже, у якому полі лежить посилання; важливо,
      # що воно наше і що воно валідне. Формат самого посилання визначає OCI, а
      # не flyctl, і він не змінюється.
      - name: Record what staging runs right now
        id: prev
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          pattern='ghcr\.io/[a-z0-9._/-]+(@sha256:[a-f0-9]{64}|:[A-Za-z0-9_.-]+)'
          ref=$(flyctl status --config server/fly.toml --json 2>/dev/null | grep -oE "$pattern" | head -1)
          if [ -z "$ref" ]; then
            ref=$(flyctl releases --config server/fly.toml --image --json 2>/dev/null | grep -oE "$pattern" | head -1)
          fi
          echo "image=$ref" >> "$GITHUB_OUTPUT"
          if [ -n "$ref" ]; then
            echo "зараз на staging: $ref"
          else
            # Не помилка: на порожньому застосунку відкочуватись нема до чого.
            # Але й мовчати не можна — без цього рядка відсутність відкату
            # виявиться в найгірший момент.
            echo '::warning::Поточний образ визначити не вдалося — автовідкат для цього рану недоступний'
          fi

      - name: Deploy image to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE='${{ needs.image.outputs.image }}'
          echo "деплоїмо $IMAGE"
          flyctl deploy \
            --config server/fly.toml \
            --image "$IMAGE" \
            --strategy rolling \
            --wait-timeout 5m

      # Деплой, який відзвітував успіхом, і застосунок, який відповідає, — різні
      # твердження. Перевіряємо друге, ззовні, як це зробив би користувач.
      - name: Verify deployment
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' https://mockup-staging.fly.dev/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "healthy: $(cat /tmp/health.json)"
              exit 0
            fi
            echo "спроба $i: HTTP $code"
            sleep 6
          done
          echo '::error::Staging не відповідає на /health після деплою'
          flyctl logs --config server/fly.toml --no-tail || true
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Автовідкат.
      #
      # `failure()` спрацьовує на будь-який провал вище — і на впалу зовнішню
      # перевірку, і на сам flyctl deploy, який здався посеред викочування.
      # Другий випадок не менш важливий за перший: саме він лишає половину
      # машин на новому образі, а половину на старому.
      #
      # Крок нічого не «лагодить» і не робить ран зеленим: джоба лишається
      # червоною, бо зміна, яку намагались доставити, зламана. Він лише
      # повертає середовище в стан, який востаннє працював.
      #
      # `immediate`, а не `rolling`: rolling існує щоб не впустити жодного
      # запиту при штатному викочуванні. Сюди ми потрапляємо тоді, коли
      # staging уже не відповідає, тож повільна обережність тут коштує
      # простою, нічого не рятуючи.
      - name: Roll back to the last working image
        if: failure() && steps.prev.outputs.image != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          PREV='${{ steps.prev.outputs.image }}'
          echo "::warning::Деплой не пройшов перевірку — повертаємо $PREV"
          flyctl deploy \
            --config server/fly.toml \
            --image "$PREV" \
            --strategy immediate \
            --wait-timeout 5m

          # Відкат, про який ми не переконались, — це друге неперевірене
          # твердження поверх першого. Питаємо ззовні, як і після деплою.
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/rb.json -w '%{http_code}' https://mockup-staging.fly.dev/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "staging повернувся: $(cat /tmp/rb.json)"
              echo "### ⏪ Відкат виконано" >> "$GITHUB_STEP_SUMMARY"
              echo "Staging повернуто на \`$PREV\`. Зміна цього рану не доставлена." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "спроба $i: HTTP $code"
            sleep 6
          done
          echo '::error::Відкат не підняв staging — потрібне ручне втручання'
          flyctl logs --config server/fly.toml --no-tail || true
          exit 1

      # Окремо від самого відкату: якщо відкочуватись не було до чого, це має
      # бути видно у зведенні, а не лише в логах кроку, який ніхто не відкриє.
      - name: Report that no rollback was possible
        if: failure() && steps.prev.outputs.image == ''
        run: |
          echo "### ⚠️ Відкат не виконувався" >> "$GITHUB_STEP_SUMMARY"
          echo "Поточний образ staging визначити не вдалося, тому повертати не було до чого. Стан середовища треба перевірити руками." >> "$GITHUB_STEP_SUMMARY"
