# Main CI pipeline.
#
# Current scope: static checks, builds, server integration tests, E2E, secret
# scanning, and a run summary.
#
# Both test layers run against real dependencies rather than mocks: E2E against
# a stub backend on BACKEND_URL, server tests against MinIO in a service
# container. A mock would only ever confirm the assumptions we wrote into it —
# signing, path-style addressing and error shapes are exactly what mocks
# imitate instead of reproducing.
#
# Layout: seven jobs, all of them in parallel. Nothing here needs anything else
# here, so the wall clock is the slowest single job, not the sum.
#
#   client-static ─┐
#   server-static ─┤
#   server-test   ─┤   (MinIO service container)
#   client-build  ─┼─► summary
#   server-build  ─┤
#   e2e           ─┤
#   security      ─┘
#
# TODO(verify): action major versions below were not checked against the
# marketplace from this environment. Confirm actions/checkout, actions/setup-node
# and gitleaks-action are on the versions pinned here, then consider pinning all
# three by commit SHA.

name: CI

# Integration branch is `momot-main`, not `main`. The filter below matches the
# PR *base* branch, so a PR targeting anything else runs nothing at all — this
# list is what decides whether the pipeline exists for a given change.
#
# `momot-main` is also the repository's default branch, which matters beyond
# looks: `schedule:` and `workflow_dispatch` workflows only ever run from the
# default branch. The nightly full E2E matrix therefore belongs on this branch
# and nowhere else.
on:
  pull_request:
    branches: [momot-main]
  push:
    branches: [momot-main]

# A second push to the same branch cancels the run still in flight. Without
# this you pay for two full pipelines and the stale result finishes last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Static analysis ────────────────────────────────────────────────────────

  client-static:
    name: Client · typecheck & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4
        with:
          # Типово checkout лишає GITHUB_TOKEN у .git/config. Жоден
          # крок нижче не робить автентифікованих git-операцій, отже
          # токен тут — лише зайва поверхня для коду, що виконується
          # після checkout (npm-скрипти, залежності, браузери).
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      # ci, not install: install silently rewrites package-lock.json when it
      # disagrees with package.json, which is how CI ends up validating a
      # dependency tree that exists on no developer's machine.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Fails only when the error count exceeds .ci/lint-baseline.json. Every
      # existing violation is still printed in full on every run, so the debt
      # stays visible rather than becoming invisible.
      #
      # NOTE: the companion gate `npm run lint:changed` (files touched by a PR
      # must be clean) is intentionally not wired up yet. MP-004 introduces the
      # entire client/ directory, so on that branch "changed files" means all
      # 104 of them and the gate is equivalent to demanding zero debt. It gets
      # added in the first PR after MP-004 lands on momot-main, where it becomes both
      # meaningful and cheap. The script is in the repo and runnable today.
      - name: Lint (baseline gate)
        run: npm run lint:baseline

  server-static:
    name: Server · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4
        with:
          # Типово checkout лишає GITHUB_TOKEN у .git/config. Жоден
          # крок нижче не робить автентифікованих git-операцій, отже
          # токен тут — лише зайва поверхня для коду, що виконується
          # після checkout (npm-скрипти, залежності, браузери).
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # No lint step: the server has no ESLint installed and no config. A script
      # that runs no real check would make this job look stronger than it is.
      # Tracked as an infrastructure gap in phase3.md section 6.2.

  # ── Builds ─────────────────────────────────────────────────────────────────

  client-build:
    name: Client · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4
        with:
          # Типово checkout лишає GITHUB_TOKEN у .git/config. Жоден
          # крок нижче не робить автентифікованих git-операцій, отже
          # токен тут — лише зайва поверхня для коду, що виконується
          # після checkout (npm-скрипти, залежності, браузери).
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      # Turbopack keeps its incremental cache in .next/cache. Restoring it
      # across runs is the difference between a cold and a warm build. The key
      # includes the lockfile and every source file, so a source change gets a
      # fresh entry while restore-keys still fall back to the nearest older one.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: client/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('client/package-lock.json') }}-${{ hashFiles('client/src/**/*.{ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('client/package-lock.json') }}-

      - name: Build
        run: npm run build

      # No artifact upload. Nothing consumes a client build yet — there is no
      # deploy and no E2E job. Uploading it would cost time on every run to
      # produce something nobody downloads. It gets added together with the
      # first consumer, which is build-once/deploy-many.

  server-build:
    name: Server · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4
        with:
          # Типово checkout лишає GITHUB_TOKEN у .git/config. Жоден
          # крок нижче не робить автентифікованих git-операцій, отже
          # токен тут — лише зайва поверхня для коду, що виконується
          # після checkout (npm-скрипти, залежності, браузери).
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

  # ── Інтеграційні тести сервера ─────────────────────────────────────────────

  server-test:
    name: Server · storage tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # MinIO піднімається через той самий docker-compose.yml, яким користується
    # локальна розробка. Тести ходять у нього тим самим кодом, яким прод ходить
    # у R2 — перевіряється справжній шлях, а не мок, який підтверджував би лише
    # наші ж припущення.
    #
    # Чому не `services:` — дві причини, і друга неочевидна:
    #
    # 1. Service-контейнери GitHub не дозволяють задати команду запуску, а
    #    офіційний образ minio/minio без `server /data` просто друкує довідку
    #    й виходить. Саме тому спершу тут стояв bitnami/minio, у якого
    #    робочий CMD за замовчуванням — а Bitnami прибрали безкоштовні образи
    #    з Docker Hub, і джоба впала ще на «Initialize containers».
    # 2. Навіть якби образ був, `services:` — це друге, окреме описання того
    #    самого середовища. Два описання розходяться. Compose-файл робить
    #    локальний стек і CI однією конфігурацією, і зламатись вони можуть
    #    тільки разом.

    env:
      STORAGE_BUCKET: mockup-uploads
      STORAGE_REGION: auto
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      STORAGE_FORCE_PATH_STYLE: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Піднімаємо сховище до npm ci, а не після: --wait блокує лише до
      # healthy (локально ~6 с), і поки воно стартує, встановлення залежностей
      # уже йде. Порядок кроків тут — це безкоштовні секунди.
      - name: Start MinIO
        working-directory: ${{ github.workspace }}
        run: docker compose up -d --wait minio

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # Окремим кроком після --wait, а не через depends_on: бакет має існувати
      # до першого тесту, інакше перший же put падає на NoSuchBucket.
      - name: Create bucket
        working-directory: ${{ github.workspace }}
        run: docker compose run --rm minio-init

      - name: Run tests
        run: npm test

      # Логи сховища потрібні рівно тоді, коли тести впали: майже кожна їхня
      # помилка — це насправді відповідь MinIO, якої не видно з боку клієнта.
      - name: MinIO logs
        if: failure()
        working-directory: ${{ github.workspace }}
        run: docker compose logs minio

  # ── End-to-end ─────────────────────────────────────────────────────────────

  e2e:
    name: E2E · Playwright (chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    env:
      # Куди Next проксює /auth/* і /dashboard/* — тут це стаб, а не справжній
      # бекенд. Виставлено і на білд, і на старт свідомо: destination у
      # rewrites фіксується на одному з цих етапів, і залежати від того, на
      # якому саме, не варто.
      BACKEND_URL: http://localhost:4010
      # Порожнє = same-origin. Браузер б'є в Next, Next проксює далі.
      NEXT_PUBLIC_API_URL: ''

    steps:
      - uses: actions/checkout@v4
        with:
          # Типово checkout лишає GITHUB_TOKEN у .git/config. Жоден
          # крок нижче не робить автентифікованих git-операцій, отже
          # токен тут — лише зайва поверхня для коду, що виконується
          # після checkout (npm-скрипти, залежності, браузери).
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      # Браузери важать сотні мегабайт і не змінюються між ранами — тягнути їх
      # щоразу означає платити хвилинами за те, що вже було. Ключ прив'язаний
      # до lockfile: оновлення @playwright/test дає новий кеш, як і має бути.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('client/package-lock.json') }}

      # Тільки chromium: PR-смуга має лишатись швидкою. Повна матриця
      # (firefox + webkit) — робота для нічного прогону, і проєкти під неї в
      # playwright.config.ts уже описані.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Прод-збірка, а не dev-сервер. Тест, зелений у dev, ще нічого не каже
      # про прод: інші таймінги, інша обробка помилок, інший рантайм React.
      # playwright.config.ts бачить CI=true і піднімає `next start`.
      - name: Build
        run: npm run build

      - name: Run E2E
        run: npm run e2e:smoke

      # Звіт потрібен рівно тоді, коли щось впало. Заливати його на кожному
      # зеленому рані — це час і місце за артефакт, який ніхто не відкриє.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

  # ── Security ───────────────────────────────────────────────────────────────

  security:
    name: Security · gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Gitleaks scans history, not just the working tree. A shallow clone
          # would let a secret that was committed and later removed pass
          # unnoticed — and removing a secret from a later commit does not
          # remove it from the repository.
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action is free for public repositories. If this repo is
          # still private when the workflow first runs, this step will ask for
          # a GITLEAKS_LICENSE and fail. Making the repo public is already the
          # plan (it also unlocks unlimited Actions minutes and branch
          # protection on the Free plan).

  # ── Summary ────────────────────────────────────────────────────────────────

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [client-static, server-static, server-test, client-build, server-build, e2e, security]
    # Run even when something upstream failed — a summary that only appears on
    # success is useless exactly when it is needed.
    if: always()

    steps:
      - name: Write run summary
        run: |
          {
            echo "## CI result"
            echo ""
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| Client typecheck & lint | ${{ needs.client-static.result }} |"
            echo "| Server typecheck | ${{ needs.server-static.result }} |"
            echo "| Server storage tests | ${{ needs.server-test.result }} |"
            echo "| Client build | ${{ needs.client-build.result }} |"
            echo "| Server build | ${{ needs.server-build.result }} |"
            echo "| E2E (chromium) | ${{ needs.e2e.result }} |"
            echo "| Gitleaks | ${{ needs.security.result }} |"
            echo ""
            echo "Lint debt is gated against \`.ci/lint-baseline.json\`, not against zero."
            echo "E2E runs chromium only, against the stub backend. Full browser matrix is nightly work."
          } >> "$GITHUB_STEP_SUMMARY"

      # The summary step above always succeeds, so it cannot be the thing that
      # turns the pipeline red. This step is what propagates upstream failure.
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required checks failed. See the table in the run summary."
          exit 1
