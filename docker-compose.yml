# Локальні залежності застосунку: база й об'єктне сховище.
#
# Сенс не в зручності, а в тому, щоб локальна розробка, CI і прод ходили одним
# і тим самим шляхом коду. MinIO говорить протоколом S3, тому драйвер
# s3.storage.ts не знає й не має знати, що перед ним не Cloudflare R2.
# Альтернатива — «локально пишемо на диск, у проді в S3» — означає, що шлях,
# який реально поїде в прод, уперше виконується в проді.
#
#   docker compose up -d          підняти
#   docker compose down -v        зупинити й стерти дані
#
# Це середовище розробки: паролі тут навмисно тривіальні й лежать у git.
# Нічого з цього не має жодного стосунку до продових ключів.

# Образи закріплені тегом + дайджестом. Тег лишається, щоб рядок можна було
# прочитати очима; дайджест — щоб він означав рівно один незмінний образ.
# `:latest` тут уже коштував нам червоного CI: bitnami/minio:latest просто
# зник із Docker Hub, і джоба впала до першого кроку. Тег, який хтось інший
# може перепризначити, — це залежність, яку ти не контролюєш.
# Оновлює їх Renovate, а не рука.

services:
  mongo:
    image: mongo:7@sha256:444d798458e5aa40f3667230a9c631974fa169c32ae4a2d924658ac72b753122
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '127.0.0.1:9000:9000'   # S3 API — сюди ходить застосунок
      - '127.0.0.1:9001:9001'   # веб-консоль, щоб очима подивитись, що лежить у бакеті
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Одноразовий контейнер: створює бакет і виходить. Без нього перший запуск
  # застосунку падає на NoSuchBucket, і кожен новий розробник має прочитати
  # документацію MinIO замість того, щоб просто працювати.
  minio-init:
    # чистий дайджест: він однозначний, а тег, якому не можна довіряти,
    # гірший за його відсутність.
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/mockup-uploads &&
      echo 'бакет mockup-uploads готовий'
      "

volumes:
  mongo-data:
  minio-data:
