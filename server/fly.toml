# Конфігурація staging-середовища бекенда на Fly.io.
#
# Цей файл лежить у git свідомо. Налаштування інфраструктури — такий самий
# код, як і застосунок: воно проходить рев'ю, має історію змін і відкочується
# разом із рештою. Те, що налаштовано кліками в панелі, не знає ніхто, крім
# того, хто клікав, і зникає разом із його пам'яттю.
#
# Чого тут НЕМАЄ і не буде: жодного секрету. Паролі й ключі живуть у
# `fly secrets`, тобто в зашифрованому сховищі Fly, і потрапляють у контейнер
# як змінні оточення на старті.
#
#   fly secrets set MONGO_URI="mongodb+srv://..." --app mockup-staging
#   fly secrets list --app mockup-staging          # показує лише імена

app = 'mockup-staging'

# Той самий регіон, що й у бази (Atlas AWS eu-central-1). Один запит
# користувача породжує десяток запитів до Mongo — і кожен платить затримку
# між застосунком і базою. Різні міста тут коштують дорожче, ніж різні
# континенти між користувачем і застосунком.
primary_region = 'fra'

# Скільки Fly чекає після SIGTERM, перш ніж надіслати SIGKILL. Має бути
# більшим за SHUTDOWN_TIMEOUT_MS застосунку, інакше платформа вб'є процес
# посеред коректної зупинки — і весь drain втрачає сенс.
kill_timeout = '50s'
kill_signal = 'SIGTERM'


# Секції [build] тут немає навмисно. Образ збирає й перевіряє CI, а деплой
# передає готовий тег через `flyctl deploy --image` — Fly у такому разі нічого
# не збирає. Описати збірку і тут означало б мати два різні способи отримати
# образ, які рано чи пізно розійдуться.

[env]
  PORT = '4000'
  NODE_ENV = 'production'
  # Продовжувати обслуговувати запити 20 с після SIGTERM, поки Fly не прибере
  # машину з балансувальника. Інтервал перевірки нижче — 15 с, тож 20 гарантує
  # щонайменше одну невдалу спробу, після якої трафік перестає йти сюди.
  # Без цієї паузи деплой «без простою» віддає користувачам 502.
  SHUTDOWN_DRAIN_MS = '20000'
  SHUTDOWN_TIMEOUT_MS = '40000'
  # Адреса фронтенду для CORS. Поки фронт не задеплоєний (крок 6), сюди
  # прописано локальний — оновимо разом із Vercel.
  FRONTEND_URL = 'http://localhost:3001'

[http_service]
  internal_port = 4000
  force_https = true

  # Машина засинає без трафіку і прокидається на перший запит. Для staging це
  # правильний компроміс: платити за простій немає сенсу, а холодний старт у
  # кілька секунд нікому не заважає. Для прода так робити не можна.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  # Скільки одночасних запитів тримає одна машина, перш ніж Fly підніме другу.
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 250

  # Перевірка, за якою Fly вирішує, чи пускати трафік на машину.
  #
  # grace_period має покривати старт: застосунок спершу підключається до
  # Mongo і лише потім починає слухати порт. Замалий grace_period — і Fly
  # вважатиме машину мертвою ще до того, як вона встигне піднятись, а тоді
  # перезапустить її по колу.
  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '20s'
    method = 'GET'
    # Readiness, а не liveness: ця перевірка вирішує, чи слати сюди трафік.
    # Вона перевіряє базу і віддає 503 під час зупинки — саме це дає Fly
    # прибрати машину з ротації ДО того, як вона закриє сокет.
    path = '/health/ready'

[[vm]]
  # Найменша конфігурація — вона входить у безкоштовний ліміт.
  # Node з дефолтним heap на 256 МБ почувається тісно; якщо побачимо
  # перезапуски через OOM, це перше місце, куди дивитись.
  size = 'shared-cpu-1x'
  memory = '512mb'
